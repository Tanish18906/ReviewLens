<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-ultrawide-desk-mat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-ultrawide-desk-mat)" />
  <!-- Category Pill -->
  <g transform="translate(48, 48)">
    <rect width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.9" />
    <text x="55" y="21" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#66758A" text-anchor="middle" letter-spacing="0.5">ACCESSORIES</text>
  </g>
  <!-- Product Illustration -->
  
        <!-- Desk Mat -->
        <rect x="150" y="180" width="500" height="240" rx="20" fill="#1E293B"/>
        <rect x="160" y="190" width="480" height="220" rx="14" fill="#0F172A" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/>
        <!-- Subtle laptop & mouse silhouette on mat -->
        <rect x="230" y="225" width="200" height="140" rx="8" fill="#334155" opacity="0.6"/>
        <rect x="490" y="255" width="50" height="80" rx="24" fill="#3559D9" opacity="0.7"/>
    
  <!-- Title watermark -->
  <text x="400" y="540" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#172235" text-anchor="middle" opacity="0.85">Ultrawide Desk Mat</text>
