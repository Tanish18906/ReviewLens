<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-smart-fitness-watch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-smart-fitness-watch)" />
  <!-- Category Pill -->
  <g transform="translate(48, 48)">
    <rect width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.9" />
    <text x="55" y="21" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#66758A" text-anchor="middle" letter-spacing="0.5">WEARABLES</text>
  </g>
  <!-- Product Illustration -->
  
        <!-- Straps -->
        <rect x="350" y="80" width="100" height="150" rx="16" fill="#334155"/>
        <rect x="350" y="370" width="100" height="150" rx="16" fill="#334155"/>
        <!-- Body -->
        <rect x="320" y="190" width="160" height="220" rx="36" fill="#172235"/>
        <!-- Screen -->
        <rect x="336" y="206" width="128" height="188" rx="26" fill="#0F172A"/>
        <!-- Heart rate graphic -->
        <path d="M 355 300 L 375 300 L 385 270 L 400 330 L 415 290 L 425 305 L 445 300" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
        <circle cx="400" cy="245" r="16" fill="#38BDF8" opacity="0.2"/>
        <text x="400" y="250" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">10:42</text>
    
  <!-- Title watermark -->
  <text x="400" y="540" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#172235" text-anchor="middle" opacity="0.85">Smart Watch</text>
</svg>